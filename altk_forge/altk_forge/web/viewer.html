}
function closeMem(gotoSpan) {
  if (!current || $("#mem").hidden) return;
  $("#mem").hidden = true;
  $("#overview").hidden = $("#inspector").hidden = false;
  selectSpan(gotoSpan || current.memFrom || current.selected);
}

function sendBar() {
  const m = current.memory, out = pipeline?.output_id, test = pipeline?.mode !== "production";
  const sentEntities = (m?.slices || []).reduce((n, s) => n + (s.entity_ids || []).length, 0);
  if (!out) return `<div class="send-bar"><span>This pipeline has no output yet: choose an altk-evolve integration on the <a class="ref" href="/">pipelines page</a> to send turns to memory.</span></div>`;
  const productive = (m?.slices || []).filter((s) => (s.entity_ids || []).length).length;
  const gl = (m?.slices || []).reduce((n, s) => n + (s.guidelines || []).length, 0);
  const sending = current.sending;
  const state = sending ? `<b style="color:var(--warning)">${esc(sending.state === "sending" ? `sending slice ${Math.min(sending.done + 1, sending.total)} of ${sending.total}` : sending.state)}</b>${sending.step ? ` · ${esc(sending.step)}` : ""} · ${esc(elapsed(sending.since))} <span class="fmeta">altk-evolve generates guidelines with an LLM: about 10 s per slice</span>`
    : m?.sent_at ? `<b style="color:var(--mem)">sent</b> ${esc(fmtDate(m.sent_at))} · ${plural((m.slices || []).length, "slice")} sent · <b>${productive}</b> of them created something · <b style="color:var(--mem)">${plural(gl, "guideline")}</b> in memory`
    : m?.error ? `<b style="color:var(--critical)">sending failed:</b> ${esc(clip(m.error, 200))}` : "not sent to memory yet";
  const actions = test
    ? `<button type="button" class="go" data-mem-send ${m?.sent_at || sending ? "disabled" : ""}>${sending ? "Sending…" : "Send this turn to memory"}</button>
       <button type="button" class="danger" data-mem-unsend ${m?.sent_at && !sending ? "" : "disabled"}>Delete what it produced in memory</button>`
    : `<span class="fmeta">production: sent automatically</span>`;
  return `<div class="send-bar"><span class="mode-tag ${esc(pipeline.mode)}">${esc(pipeline.mode)}</span><span>${state}</span>${actions}<span class="fmeta" id="mem-status" aria-live="polite"></span></div>`;
}

function renderMem() {
  const { doc } = current, slices = slicesOf();
  const sent = slices;  // every llm call is sent; altk-evolve decides what is worth a guideline
  const nss = [...new Set(sent.map((x) => x.namespace_id))];
  const count = (l) => sent.filter((x) => x.label === l).length;
  const item = (x) => `<button class="mem-item" role="option" data-mem="${esc(x.span_id)}" aria-selected="${x.span_id === current.memSel}">
      <span class="step"><span class="n">#${current.num.get(x.span_id)}</span>${esc(x.step)}<span class="label ${x.label}">${x.label}</span>${sentTag(x)}${x.extra.guidelines_given ? `<span class="mem-dot" style="color:var(--mem);font-size:11px">+${x.extra.guidelines_given.length} gl</span>` : ""}</span>
      ${x.problem ? `<span class="why-not">${esc(clip(x.problem, 110))}</span>` : ""}<span class="ns">${esc(x.namespace_id)}</span>
    </button>`;
  $("#mem").innerHTML = `
    <div class="mem-head">
      <div class="mem-head-top">
        <button class="mem-back" data-mem-back type="button">← Back to trajectory</button>
        <span class="mem-title">Memory</span>
        <span class="fmeta">what this turn sends to altk-evolve, one slice per llm call</span>
      </div>
      <div class="mem-q">${esc(clip(doc.tree.input, 200))}</div>
      <div class="mem-sum">
        <span><b>${sent.length}</b> slices to send</span>
        <span><b>${count("success")}</b> success · <b>${count("failure")}</b> failure · <b>${count("unknown")}</b> unknown</span>
        <span>into <b>${nss.length}</b> ${nss.length === 1 ? "namespace" : "namespaces"}</span>
      </div>
      ${sendBar()}
    </div>
    <div class="mem-body">
      <div class="mem-list" role="listbox" aria-label="Slices">
        ${sent.length ? `<div class="mem-group">Sent to altk-evolve · ${sent.length}</div>${sent.map(item).join("")}` : ""}
      </div>
      <div class="mem-detail" id="mem-detail">${memDetail(slices.find((x) => x.span_id === current.memSel))}</div>
    </div>`;
}

function memDetail(x) {
  if (!x) return `<div class="empty">This turn has no llm calls.</div>`;
  const n = current.num.get(x.span_id);
  let head = `<div class="insp-head">
      <span class="kind">slice of llm call</span>
      <span class="insp-title">#${n} ${esc(x.step)}</span>
      <span class="label ${x.label}">${x.label}</span>
      <span class="nav"><button data-mem-goto="${esc(x.span_id)}" type="button">show in trajectory</button></span>
    </div>`;
  const given = x.extra.guidelines_given?.length ? `<div class="gl"><span class="gl-head">◆ guidelines from memory this call was given <span>they are in its system prompt, which is not sent; listed in the evaluation message</span></span>
      <ol>${x.extra.guidelines_given.map((g) => `<li>${esc(g)}</li>`).join("")}</ol></div>` : "";
  if (x.problem) head += `<div class="mem-excl"><b>What went wrong with this call.</b> ${esc(x.problem)} It is sent all the same, with this in its evaluation: altk-evolve decides whether it is worth a guideline.</div>`;
  const roleName = (m) => (m.review ? "evaluation" : m.role);
  const msgs = x.messages.map((m, i) => {
    const text = m.tool_calls ? [m.content, ...m.tool_calls.map((tc) => `tool_call ${tc.function.name}\n${asText(tc.function.arguments)}`)].filter(Boolean).join("\n\n")
      : m.role === "tool" ? asText(m.content) : String(m.content ?? "");
    const what = m.review ? "added by Forge: label, checks, expected answer, guidelines given" : i === 0 ? "task: user question, handoff and the input the model had (system prompt left out)"
      : m.role === "assistant" ? "what the model returned" : "what the tool returned";
    const body = m.review ? esc(text).replace(/(Guidelines from memory the model was given:)/, `<b style="color:var(--mem)">$1</b>`) : esc(text);
    return `<div class="mem-msg ${m.review ? "review" : m.role}"><div class="mem-msg-head"><b>${esc(roleName(m))}</b><span>messages[${i}] · ${esc(what)}</span><span>${fmtNum(text.length)} chars</span></div><pre class="val">${body}</pre></div>`;
  }).join("");
  const tr = x.trajectory;
  const args = { namespace_id: x.namespace_id, ...tr, messages: `[${tr.messages.length} messages, shown above]`, tools: tr.tools ? `[${tr.tools.length} tool definitions]` : undefined };
  const sentBlock = !x.sent ? ""
    : generatedOf(x).length ? `<div class="gl gl-made"><span class="gl-head">◆ ${plural(generatedOf(x).length, "guideline")} altk-evolve generated from this slice
        <span>in namespace ${esc(x.sent.namespace)}${(x.sent.entity_ids || []).length ? ` · entity ${esc(x.sent.entity_ids.join(", "))}` : ""}</span></span>
        <ol>${generatedOf(x).map((g) => `<li>${esc(g)}</li>`).join("")}</ol></div>`
    : viewerBlock("sent, nothing generated", `<span>altk-evolve processed this slice${x.sent.operation_id ? ` (operation ${esc(x.sent.operation_id)})` : ""} and found no lesson worth a guideline in it${createdBy(x) ? `; it stored ${plural(createdBy(x), "entity", "entities")}` : ""}.</span>`);
  return head + sentBlock + `
    <div class="mem-target">
      <small>namespace in altk-evolve</small>
      <span class="ns">${esc(x.namespace_id)}</span>
      <small>pipeline <b>${esc(PIPE)}</b> · agent <b>${esc(x.agent)}</b> · step <b>${esc(x.purpose)}</b>. Every call of this step, from every turn, goes to the same namespace, so its guidelines can be retrieved for that step only.</small>
    </div>
    ${given}
    ${x.checks.length ? viewerBlock("checks behind the label", `<ul class="why">${x.checks.map((c) => whyItem({ cls: c.ok === true ? "ok" : c.ok === false ? "bad" : "", ico: c.ok === true ? "✓" : c.ok === false ? "✕" : "·", text: esc(c.text) })).join("")}</ul>`) : ""}
    <h2>trajectory.messages · ${x.messages.length} messages</h2>
    <div class="mem-msgs">${msgs}</div>
    ${dataBlock("POST /api/trajectories body (trajectory)", kv(Object.entries(args).filter(([, v]) => v !== undefined).map(([k, v]) => [k, v == null ? `<span class="fmeta">null</span>` : esc(typeof v === "string" ? v : JSON.stringify(v))])))}
    ${viewerBlock("kept only here", kv(Object.entries(x.extra).map(([k, v]) => [k, v == null ? null : esc(typeof v === "string" ? v : JSON.stringify(v))])))}
    <div class="mem-actions">
      <button type="button" data-mem-copy="call">Copy this slice (JSON)</button>
      <button type="button" data-mem-copy="all">Copy all slices of this turn</button>
      <span class="fmeta" id="mem-copied" aria-live="polite"></span>
    </div>`;
}

function selectMem(id) {
  current.memSel = id;
  document.querySelectorAll("#mem .mem-item").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mem === id)));
  $("#mem-detail").innerHTML = memDetail(slicesOf().find((x) => x.span_id === id));
  $("#mem-detail").scrollTop = 0;
  document.querySelector(`#mem .mem-item[data-mem="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}
const sliceJson = (x) => ({ namespace_id: x.namespace_id, trajectory: x.trajectory, _forge: x.extra });
async function memAction(op) {
  const status = $("#mem-status"), id = current.doc.trace_id;
  if (op === "unsend" && !await ask.confirm({ danger: true, title: "Delete this turn from memory?", ok: "Delete from memory",
    message: "Everything this turn produced in memory is deleted: its trajectory entities and the guidelines generated from it." })) return;
  document.querySelectorAll("[data-mem-send], [data-mem-unsend]").forEach((b) => { b.disabled = true; });
  status.textContent = op === "send" ? "sending…" : "deleting…";
  // While it runs, ask the server how far it got; the bar shows the slice being sent and the time so far.
  let poll = null;
  if (op === "send") {
    current.sending = { state: "starting", done: 0, total: slicesOf().length, since: new Date().toISOString() };
    if (!$("#mem").hidden) renderMem();
    poll = setInterval(async () => {
      const p = await fetch(`${API}/trajectories/${encodeURIComponent(id)}/sending`).then((x) => x.json()).catch(() => null);
      if (p?.progress && current?.doc.trace_id === id) { current.sending = p.progress; if (!$("#mem").hidden) renderMem(); }
    }, 1000);
  }
  const r = await fetch(`${API}/trajectories/${encodeURIComponent(id)}/${op}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  clearInterval(poll);
  if (current) current.sending = null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok && /^No pipeline /.test(data.error || "")) { pipelineGone(); $("#mem-status").textContent = "this pipeline no longer exists"; return; }
  await loadSlices();
  const row = index.find((t) => t.trace_id === id);
  if (row) row.memory = current.memory ? { sent_at: current.memory.sent_at, error: current.memory.error } : null;
  renderMem(); renderList(); updateMemButton();
  const made = (data.slices || []).reduce((n, s) => n + (s.guidelines || []).length, 0);
  $("#mem-status").textContent = !r.ok ? data.error || "failed"
    : op === "send" ? `done: ${plural(made, "guideline")} from ${plural((data.slices || []).filter((s) => (s.guidelines || []).length).length, "slice")}`
    : `deleted ${data.entities} entities`;
  if (!r.ok) $("#mem-status").style.color = "var(--critical)";
}

// ---------------------------------------------------------------- events
$("#q").addEventListener("input", renderList);
$("#show").addEventListener("change", renderList);
$("#sort").addEventListener("change", renderList);
$("#items").addEventListener("click", (e) => { const b = e.target.closest(".item"); if (b) select(b.dataset.id); });
// text / raw toggle of an answer
function toggleView(e) {
  const view = e.target.closest("[data-view]");
  if (!view) return false;
  const block = view.closest(".data, .io");
  block.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b === view)));
  block.querySelectorAll("[data-answer]").forEach((p) => { p.hidden = p.dataset.answer !== view.dataset.view; });
  return true;
}
$("#overview").addEventListener("click", (e) => {
  if (e.target.closest("[data-mem-open]")) return openMem();
  if (toggleView(e)) return;
  const row = e.target.closest(".tl-row");
  if (row) selectSpan(row.dataset.span);
});
$("#inspector").addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) { e.preventDefault(); if (go.dataset.goto) selectSpan(go.dataset.goto); return; }
  toggleView(e);
});
$("#mem").addEventListener("click", async (e) => {
  if (e.target.closest("[data-mem-back]")) return closeMem();
  const go = e.target.closest("[data-mem-goto], [data-goto]");
  if (go) { e.preventDefault(); return closeMem(go.dataset.memGoto || go.dataset.goto); }
  const it = e.target.closest("[data-mem]");
  if (it) return selectMem(it.dataset.mem);
  if (e.target.closest("[data-mem-send]")) return memAction("send");
  if (e.target.closest("[data-mem-unsend]")) return memAction("unsend");
  const cp = e.target.closest("[data-mem-copy]");
  if (cp) {
    const slices = slicesOf();
    const value = cp.dataset.memCopy === "all" ? slices.map(sliceJson) : sliceJson(slices.find((x) => x.span_id === current.memSel));
    try { await navigator.clipboard.writeText(JSON.stringify(value, null, 2)); $("#mem-copied").textContent = "copied"; }
    catch { $("#mem-copied").textContent = "the browser blocked the clipboard"; }
  }
});
document.addEventListener("keydown", (e) => {
  if (current && !$("#mem").hidden && !e.target.closest("input, textarea")) {
    if (e.key === "Escape") { e.preventDefault(); return closeMem(); }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const ids = [...document.querySelectorAll("#mem .mem-item")].map((b) => b.dataset.mem);
      const next = ids[ids.indexOf(current.memSel) + (e.key === "ArrowDown" ? 1 : -1)];
      if (next) { e.preventDefault(); selectMem(next); }
      return;
    }
  }
  if (!current || e.target.closest("input, textarea") || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
  const i = current.order.findIndex((o) => o.span.span_id === current.selected);
  const next = current.order[i + (e.key === "ArrowDown" ? 1 : -1)];
  if (next) { e.preventDefault(); selectSpan(next.span.span_id); }
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== current?.doc.trace_id) select(id); });

loadIndex().catch((err) => { $("#inspector").innerHTML = `<div class="empty">Could not load data: ${esc(err.message)}. Is the server running?</div>`; });
</script>
</body>
</html>
