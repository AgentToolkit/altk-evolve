# Approved list adapted from CUGA PR #978 at:
# https://github.com/cuga-project/cuga-agent/blob/b7e9f7eb73fe9bf8967ee56cebabf51dea1abc3a/.github/licenses/policy.json
license-check: true
vulnerability-check: false
comment-summary-in-pr: never
show-openssf-scorecard: false
allow-licenses:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  # CUGA also lists BSD-0-Clause, which is invalid SPDX; 0BSD below covers it.
  - ISC
  - 0BSD
  - CC0-1.0
  - Unlicense
  - Zlib
  - BSL-1.0
  - OFL-1.1
  - BlueOak-1.0.0
  - PSF-2.0
  - Python-2.0
  - Apache-2.0 WITH LLVM-exception
  - MIT-CMU
