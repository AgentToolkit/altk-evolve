name: Check Dependency Licenses

# The write token is needed for snapshots, including PRs from forks. Only the
# trusted base revision is checked out; PR lockfiles are read as data via the API.
on:
  pull_request_target:
    branches: [main]

concurrency:
  group: license-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  license-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Prepare base lockfiles
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await require('./.github/scripts/prepare-license-inventory.cjs')({github, context, core}, 'base');
      - name: Submit base dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          filePath: .
          detectorsFilter: UvLock,NpmLockfile3
          detectorArgs: UvLock=EnableIfDefaultOff,NpmLockfile3=EnableIfDefaultOff
          fail-on-empty: 'true'
          correlator: evolve-license-lockfiles
          snapshot-sha: ${{ github.event.pull_request.base.sha }}
          snapshot-ref: refs/heads/${{ github.event.pull_request.base.ref }}
      - name: Prepare head lockfiles
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await require('./.github/scripts/prepare-license-inventory.cjs')({github, context, core}, 'head');
      - name: Submit head dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          filePath: .
          detectorsFilter: UvLock,NpmLockfile3
          detectorArgs: UvLock=EnableIfDefaultOff,NpmLockfile3=EnableIfDefaultOff
          fail-on-empty: 'true'
          correlator: evolve-license-lockfiles
          snapshot-sha: ${{ github.event.pull_request.head.sha }}
          snapshot-ref: refs/pull/${{ github.event.pull_request.number }}/head
      - name: Review dependency licenses
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/licenses/dependency-review.yml
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          retry-on-snapshot-warnings: 'true'
          retry-on-snapshot-warnings-timeout: '120'
