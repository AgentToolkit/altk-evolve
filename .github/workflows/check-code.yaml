name: Check Formatting with Ruff

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-distributions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'altk_evolve/frontend/ui/package-lock.json'
      - name: Build packaged UI
        working-directory: altk_evolve/frontend/ui
        run: npm ci && npm run build
      - name: Build both distributions from their sdists
        run: |
          uv run --no-project python scripts/sync_convenience.py --check
          uv build --all-packages
      - name: Test clean core and convenience installations
        run: |
          uv venv /tmp/evolve-core
          uv venv /tmp/evolve-convenience
          uv pip install --python /tmp/evolve-core/bin/python dist/altk_evolve_core-*.whl
          uv pip install --python /tmp/evolve-convenience/bin/python dist/*.whl
          cd /tmp
          uv run --no-project --python /tmp/evolve-core/bin/python python "$GITHUB_WORKSPACE/scripts/smoke_distribution.py" core
          uv run --no-project --python /tmp/evolve-convenience/bin/python python "$GITHUB_WORKSPACE/scripts/smoke_distribution.py" convenience
  check-lockfile:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Check uv Lockfile
        run: |
          uv run --no-project python scripts/sync_convenience.py --check
          uv lock --check
  check-linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Check Formatting
      run: uv run ruff check
  check-formatting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Check Formatting
      run: uv run ruff format --check
  check-typing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    # Install every extra so code behind optional dependencies (e.g. fastembed)
    # is type-checked against real stubs rather than silently treated as Any.
    - name: Install dependencies
      run: uv sync --frozen --all-groups --all-extras
    - name: Check typing
      run: uv run --no-sync mypy .

  check-plugins-rendered:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Verify platform-integrations matches a fresh render of plugin-source
      run: uv run python plugin-source/build_plugins.py check

  test-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - id: plan
        run: uv run --no-project python scripts/ci/platform_tests.py

  regular-tests:
    runs-on: ubuntu-latest
    # This job runs PR-authored test code (pull_request trigger). It must stay
    # credential-free so a malicious PR cannot exfiltrate secrets or the
    # checkout token. The cpex-guarded hook tests mock `completion` and need no
    # real key; live/e2e tests are deselected by the pytest `addopts`
    # (`-m 'not llm and not e2e'`) the composite action inherits. Credentialed
    # coverage lives in release-github.yaml's own run-tests job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Runs the suite with all extras installed (uv sync --all-extras in the
      # composite action), so the cpex-guarded hook tests actually gate PRs.
      - uses: ./.github/actions/run-tests
        with:
          suite: regular

  platform-tests:
    needs: test-plan
    # A failed planner must never silently suppress coverage.
    if: ${{ always() && (needs.test-plan.result != 'success' || needs.test-plan.outputs.platform != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/run-tests
        with:
          suite: platform

  # Preserve existing required check names while gating both test groups.
  run-tests:
    needs: [test-plan, regular-tests, platform-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Verify selected test groups succeeded
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          PLATFORM_SELECTED: ${{ needs.test-plan.outputs.platform }}
          REGULAR_RESULT: ${{ needs.regular-tests.result }}
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$REGULAR_RESULT" = success
          case "$PLATFORM_SELECTED" in
            true) test "$PLATFORM_RESULT" = success ;;
            false) test "$PLATFORM_RESULT" = skipped ;;
            *) echo 'Missing or invalid test plan' >&2; exit 1 ;;
          esac

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'altk_evolve/frontend/ui/package-lock.json'
      - name: Install dependencies
        working-directory: altk_evolve/frontend/ui
        run: npm install
      - name: Run UI Unit Tests
        working-directory: altk_evolve/frontend/ui
        run: npm run test -- --run
