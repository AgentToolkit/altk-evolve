name: Run tests
description: "Run the tests"
inputs:
  suite:
    description: "Test group: all, regular, or platform"
    default: all
runs:
  using: 'composite'
  steps:
    - name: Install Python Dependencies
      shell: bash
      run: uv sync --frozen --all-groups --all-extras

    - name: Run tests
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.suite }}
      run: |
        case "$TEST_SUITE" in
          all) uv run --no-sync pytest -v --cov=. --cov-report=html ;;
          regular) uv run --no-sync pytest -v -m 'not platform_integrations and not e2e and not llm' --cov=. --cov-report=html ;;
          platform) uv run --no-sync pytest -v tests/platform_integrations -m 'platform_integrations and not e2e and not llm' --cov=. --cov-report=html ;;
          *) echo "Unknown test suite: $TEST_SUITE" >&2; exit 1 ;;
        esac
